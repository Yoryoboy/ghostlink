name = "ghostlink-token-broker"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
BUNGIE_CLIENT_ID = "55099"
ALLOWED_REDIRECT_URI = "ghostlink://oauth/callback"
BUNGIE_TOKEN_ENDPOINT = "https://www.bungie.net/platform/app/oauth/token/"

# Store BUNGIE_CLIENT_SECRET with `wrangler secret put`, never in this file.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Do not enable request tracing/log persistence for an OAuth token service.
[observability]
enabled = false
