[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = ["github"]
installers = ["shell", "powershell"]
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
install-path = "CARGO_HOME"
install-updater = true
# Build only the release package, not standalone MCP or its offline fixture.
precise-builds = true
# Pull requests do not publish anything; skip the release workflow on them.
pr-run-mode = "skip"

[dist.dependencies.apt]
pkg-config = "*"
