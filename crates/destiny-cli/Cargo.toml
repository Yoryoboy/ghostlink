[package]
name = "ghostlink"
version.workspace = true
edition.workspace = true
license.workspace = true

repository.workspace = true
homepage.workspace = true
description.workspace = true
authors.workspace = true
default-run = "ghostlink"
autobins = false

# Preserve Rust imports while shipping both product executables in one release.
[lib]
name = "destiny_cli"

[package.metadata.dist]
dist = true
[[bin]]
name = "ghostlink"
path = "src/main.rs"

[[bin]]
name = "destiny-mcp"
path = "src/bin/destiny_mcp.rs"

[dependencies]
destiny-mcp = { path = "../destiny-mcp" }
clap.workspace = true
destiny-adapters = { path = "../destiny-adapters" }
destiny-app.workspace = true
destiny-output.workspace = true
dialoguer = { version = "0.12.0", default-features = false }
serde_json.workspace = true

# Terminal echo suppression for the interactive paste login. Echo is a device
# property, so only the Unix binding needs the raw termios and signal surface;
# Windows uses the console API through a local binding instead.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Unit and integration tests use the application fakes. Declaring the feature
# here keeps `cargo test -p ghostlink` compiling on its own instead of relying
# on workspace feature unification from sibling dev-dependencies.
[dev-dependencies]
destiny-app = { workspace = true, features = ["test-support"] }
