# Weekly featured rotation calendar.
#
# Algorithm and lists follow the ShatteredVault weekly engine
# (https://shatteredvault.com/the-portal/, fetched 2026-10-06):
#   week  = floor((t - reference_reset) / 7 days)
#   entry = entries[(anchor + week) mod len(entries)]
# Every rotation is independent. When a verified in-game week disagrees, move
# that rotation's anchor; do not reorder its entries.
#
# Each activity carries a short display name and one Manifest activity hash.
# The hash identifies the activity; the Manifest name of that hash must
# contain the display name.

reference_reset = "2026-09-22T17:00:00Z"

