[package]
name = "destiny-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
destiny-core.workspace = true
getrandom = "0.4"
keyring-core.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
url.workspace = true

[dev-dependencies]
destiny-app = { path = "../destiny-app", features = ["test-support"] }
destiny-cli = { path = "../destiny-cli" }
# Dev-only edge used by the CLI/MCP read-parity journey to serialize the real
# MCP read projections. Production edges stay `destiny-mcp -> destiny-adapters`;
# this dev-dependency edge introduces no production dependency inversion.
destiny-mcp = { path = "../destiny-mcp" }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, features = ["keychain", "protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
dbus-secret-service-keyring-store = { workspace = true, features = ["crypto-rust"] }
