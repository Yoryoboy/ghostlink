[package]
name = "destiny-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
destiny-core.workspace = true
keyring-core.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde_json.workspace = true
url.workspace = true

[dev-dependencies]
destiny-app = { path = "../destiny-app", features = ["test-support"] }
destiny-cli = { path = "../destiny-cli" }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { workspace = true, features = ["keychain", "protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
dbus-secret-service-keyring-store = { workspace = true, features = ["crypto-rust"] }
