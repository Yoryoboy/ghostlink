[package]
name = "destiny-adapters"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
destiny-core.workspace = true
getrandom = "0.4"
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
toml = { version = "=0.9.8", default-features = false, features = ["parse", "serde"] }
url.workspace = true

[dev-dependencies]
flate2 = "1.1"
destiny-app = { path = "../destiny-app", features = ["test-support"] }
destiny-cli = { package = "ghostlink", path = "../destiny-cli" }
# Dev-only edge used by the CLI/MCP read-parity journey to serialize the real
# MCP read projections. Production edges stay `destiny-mcp -> destiny-adapters`;
# this dev-dependency edge introduces no production dependency inversion.
destiny-mcp = { path = "../destiny-mcp" }
