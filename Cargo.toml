[workspace]
resolver = "2"
members = [
    "crates/destiny-core",
    "crates/destiny-app",
    "crates/destiny-adapters",
    "crates/destiny-cli",
    "crates/destiny-mcp",
    "crates/destiny-output",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0-rc.1"
repository = "https://github.com/Yoryoboy/ghostlink"
homepage = "https://github.com/Yoryoboy/ghostlink"
description = "Destiny inventory tools for the command line and AI agents"
authors = ["Yoryoboy"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "gzip"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
url = "2.5"
rmcp = { version = "=3.4.0", features = ["server", "transport-io"] }
apple-native-keyring-store = "1.0.2"
dbus-secret-service-keyring-store = "1.0.1"
destiny-output = { path = "crates/destiny-output" }
destiny-app = { path = "crates/destiny-app" }
destiny-adapters = { path = "crates/destiny-adapters" }
destiny-core = { path = "crates/destiny-core" }
keyring-core = "1.0.0"
tokio = { version = "1", default-features = false }
windows-native-keyring-store = "1.1.0"

# cargo-dist's optimized release profile.
[profile.dist]
inherits = "release"
lto = "thin"
