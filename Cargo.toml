[workspace]
resolver = "2"
members = [
    "crates/destiny-core",
    "crates/destiny-app",
    "crates/destiny-adapters",
    "crates/destiny-cli",
    "crates/destiny-mcp",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
url = "2.5"
destiny-app = { path = "crates/destiny-app" }
destiny-core = { path = "crates/destiny-core" }
