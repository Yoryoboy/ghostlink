[workspace]
resolver = "2"
members = [
    "crates/destiny-core",
    "crates/destiny-app",
    "crates/destiny-adapters",
    "crates/destiny-cli",
    "crates/destiny-mcp",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
serde_json = "1.0"
url = "2.5"
apple-native-keyring-store = "1.0.2"
dbus-secret-service-keyring-store = "1.0.1"
destiny-app = { path = "crates/destiny-app" }
destiny-core = { path = "crates/destiny-core" }
keyring-core = "1.0.0"
windows-native-keyring-store = "1.1.0"
