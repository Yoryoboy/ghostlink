name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'docs/**', 'odd/**', '.engram/**']
  pull_request:
    paths-ignore: ['*.md', 'docs/**', 'odd/**', '.engram/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # CI never reads debuggers' symbols; skipping debuginfo (PDBs on Windows)
  # shrinks compile and link time. Panic locations still report file:line.
  CARGO_PROFILE_DEV_DEBUG: 0
  # The MSVC linker dominates Windows test builds; LLD links far faster.
  # Only affects the Windows MSVC target.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe

jobs:
  broker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: broker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: broker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Supported platforms: Linux and Windows. macOS is out of scope.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The Linux native credential store links libdbus through pkg-config.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      # Formatting is platform independent; check it once.
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # `hardening_leak_journey` runs the real `ghostlink` binary from the target
      # directory, so the product binary must exist before the tests run.
      - name: Build
        run: |
          cargo build --locked --workspace --all-features
          cargo build --locked -p ghostlink

      - name: Test
        # Run every test binary so one failure does not hide platform failures
        # in later crates.
        run: cargo test --locked --workspace --all-features --no-fail-fast
